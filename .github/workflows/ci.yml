name: CI

on:
  push:
    # Each of these branches is a release channel (see RELEASING.md).
    branches: [main, develop, alpha]
  pull_request:

# Cancel superseded PR runs; never cancel a push run mid-release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  # Commit messages decide the next version, so PR commits must follow
  # Conventional Commits (rules in commitlint.config.mjs).
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint PR commit messages
        run: >
          npx -y -p @commitlint/cli@21.2.3 -p @commitlint/config-conventional@21.2.3
          commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The API and app type-checks import the generated Prisma client.
      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Type-check (site, admin, api)
        run: npm run check-types

      - name: Build (site, admin, api)
        run: npm run build
        env:
          # Build-time only; the apps talk to the API at runtime via env.
          NEXT_TELEMETRY_DISABLED: "1"

      # Lint errors fail the build. Known findings in code the Phase 3 theme and
      # Phase 4 editor rewrite are warnings until then (eslint-config base.js).
      - name: Lint
        run: npm run lint

  # Tag + GitHub Release on every green push to a release branch:
  # main -> vX.Y.Z, develop -> vX.Y.Z-beta.N, alpha -> vX.Y.Z-alpha.N.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # create tags + releases
      issues: write # open an issue if a release fails
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Semantic release
        run: npx -y -p semantic-release@25.0.9 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After a stable release, merge main back into develop so the new tag is part
  # of develop's history. Without it, betas keep counting from the old version
  # (1.0.0-beta.2 instead of 1.1.0-beta.1). A merge conflict fails this job so
  # it gets resolved by hand instead of guessed.
  sync-develop:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the merge to develop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Merge main into develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "develop already contains main"
            exit 0
          fi
          git merge --no-ff origin/main -m "chore(release): sync develop with main"
          git push origin develop
